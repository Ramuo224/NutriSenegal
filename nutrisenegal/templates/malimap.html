<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaliMap — Carte Nutritionnelle en Temps Réel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #F5F7FA;
        }
        
        header {
            background: linear-gradient(135deg, #0066CC 0%, #0052A3 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 102, 204, 0.15);
        }
        
        header h1 {
            font-size: 1.8em;
            margin-bottom: 8px;
            word-break: break-word;
        }
        
        header p {
            font-size: 0.95em;
            opacity: 0.95;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        #map {
            height: 550px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 102, 204, 0.1);
        }
        
        .sidebar {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 102, 204, 0.1);
            padding: 18px;
            overflow-y: auto;
            max-height: 550px;
        }
        
        .sidebar h3 {
            color: #0052A3;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .region-item {
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid;
            background: #F9FBFD;
        }
        
        .region-item:hover {
            transform: translateX(3px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .region-name {
            font-weight: 600;
            margin-bottom: 4px;
            color: #333;
        }
        
        .region-score {
            font-size: 1em;
            margin: 3px 0;
            color: #0066CC;
        }
        
        .region-cas {
            font-size: 0.8em;
            color: #666;
        }
        
        .critique { border-left-color: #D32F2F; background: #FFEBEE; }
        .eleve { border-left-color: #F57C00; background: #FFF3E0; }
        .modere { border-left-color: #FBC02D; background: #FFFDE7; }
        .bas { border-left-color: #2E7D32; background: #E8F5E9; }
        
        .legend {
            background: #F9FBFD;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            border: 1px solid #E0E0E0;
        }
        
        .legend strong {
            display: block;
            margin-bottom: 10px;
            color: #0052A3;
            font-size: 0.95em;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
            font-size: 0.85em;
        }
        
        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .color-critique { background: #D32F2F; }
        .color-eleve { background: #F57C00; }
        .color-modere { background: #FBC02D; }
        .color-bas { background: #2E7D32; }
        
        /* Responsive Design */
        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
                padding: 15px;
            }
            
            #map {
                height: 400px;
            }
            
            .sidebar {
                max-height: 300px;
            }
        }
        
        @media (max-width: 768px) {
            header {
                padding: 20px 15px;
            }
            
            header h1 {
                font-size: 1.4em;
            }
            
            header p {
                font-size: 0.9em;
            }
            
            .content {
                padding: 12px;
            }
            
            #map {
                height: 350px;
            }
            
            .sidebar {
                max-height: 250px;
                padding: 15px;
            }
            
            .region-item {
                padding: 10px;
            }
        }
        
        @media (max-width: 480px) {
            header {
                padding: 15px 10px;
            }
            
            header h1 {
                font-size: 1.2em;
            }
            
            .content {
                padding: 10px;
            }
            
            #map {
                height: 300px;
            }
            
            .sidebar {
                max-height: 200px;
                padding: 12px;
            }
            
            .region-name {
                font-size: 0.9em;
            }
            
            .region-score {
                font-size: 0.85em;
            }
        }
    </style>
    </style>
</head>
<body>
    <header>
        <h1>🗺️ MaliMap</h1>
        <p>Carte de risque nutritionnel en temps réel au Sénégal</p>
    </header>
    
    <div class="content">
        <div id="map"></div>
        
        <div class="sidebar">
            <h3>Régions — Risque</h3>
            <div id="regions-list"></div>
            
            <div class="legend">
                <strong>Niveaux de risque:</strong>
                <div class="legend-item">
                    <div class="legend-color color-critique"></div>
                    <span>Critique (>70)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color color-eleve"></div>
                    <span>Élevé (50-70)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color color-modere"></div>
                    <span>Modéré (30-50)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color color-bas"></div>
                    <span>Bas (<30)</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        // Initialiser carte Leaflet
        const map = L.map('map').setView([14.5, -14.5], 6);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);
        
        // Charger données régions
        async function chargerRegions() {
            try {
                const response = await fetch('/api/malimap/regions');
                const regions = await response.json();
                
                // Afficher dans sidebar
                const regionsList = document.getElementById('regions-list');
                regionsList.innerHTML = '';
                
                // Ajouter marqueurs sur carte
                regions.forEach(region => {
                    // Déterminer la classe CSS et couleur
                    const className = region.niveau === 'CRITIQUE' ? 'critique' : 
                                     region.niveau === 'ÉLEVÉ' ? 'eleve' : 
                                     region.niveau === 'MODÉRÉ' ? 'modere' : 'bas';
                    
                    const color = region.niveau === 'CRITIQUE' ? '#d62728' : 
                                 region.niveau === 'ÉLEVÉ' ? '#ff7f0e' : 
                                 region.niveau === 'MODÉRÉ' ? '#ffdd57' : '#2ca02c';
                    
                    // Ajouter dans sidebar
                    const regionEl = document.createElement('div');
                    regionEl.className = `region-item ${className}`;
                    regionEl.innerHTML = `
                        <div class="region-name">${region.nom}</div>
                        <div class="region-score">Score: ${region.score}</div>
                        <div class="region-cas">Cas 30j: ${region.cas_30j}</div>
                    `;
                    regionsList.appendChild(regionEl);
                    
                    // Ajouter marqueur sur carte
                    L.circleMarker([region.lat, region.lon], {
                        radius: 15,
                        fillColor: color,
                        color: '#000',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).bindPopup(`
                        <strong>${region.nom}</strong><br>
                        Score: ${region.score}<br>
                        Niveau: ${region.niveau}<br>
                        Cas détectés: ${region.cas_30j}
                    `).addTo(map);
                });
                
            } catch (error) {
                console.error('Erreur chargement régions:', error);
            }
        }
        
        chargerRegions();
        // Rafraîchir toutes les 5 minutes
        setInterval(chargerRegions, 300000);
    </script>
</body>
</html>
